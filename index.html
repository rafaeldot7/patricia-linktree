<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dra. Patricia Camargos | Dentista RJ</title>
<meta name="description" content="Dra. Patricia Camargos — Dentista e Harmonização Facial no Rio de Janeiro. Agende sua avaliação." />
<style>
  :root{
    --petrol-900:#0b3436;
    --petrol-800:#0f4a4c;
    --petrol-700:#155e5f;
    --offwhite:#f7f4ee;
    --offwhite-2:#efe9dd;
    --gold:#bd9a5f;
    --gold-light:#e6cd9a;
    --ink:#1c2b2a;
    --muted:#5b6b69;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  .glass-filter-defs{
    position:absolute;
    width:0;
    height:0;
    overflow:hidden;
    pointer-events:none;
  }

  html,body{
    height:100%;
    overflow:hidden;
  }

  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 15% 8%, rgba(189,154,95,0.16), transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(21,94,95,0.14), transparent 45%),
      linear-gradient(160deg, var(--offwhite) 0%, var(--offwhite-2) 100%);
    height:100dvh;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: clamp(14px, 3.4vh, 32px) clamp(18px, 4.6vw, 32px);
  }

  .card{
    width:100%;
    max-width:480px;
    height:100%;
    max-height:820px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    text-align:center;
    padding: clamp(16px, 3.4vh, 32px) clamp(12px, 3.4vw, 25px);
  }

  .top{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(7px, 1.6vh, 14px);
  }

  .avatar-wrap{
    position:relative;
    width:clamp(87px, 23vw, 124px);
    height:clamp(87px, 23vw, 124px);
    margin-bottom:clamp(5px, 1.2vh, 12px);
  }

  .avatar-ring{
    position:absolute;
    inset:-7px;
    border-radius:50%;
    background:conic-gradient(from 180deg, var(--gold), var(--gold-light), var(--petrol-700), var(--gold));
    opacity:0.9;
    filter:blur(0.2px);
  }

  .avatar{
    position:relative;
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
    border:3px solid var(--offwhite);
    box-shadow:0 6px 18px rgba(11,52,54,0.18);
  }

  .avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  h1{
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,serif;
    font-weight:400;
    font-size:clamp(24px, 6.2vw, 32px);
    letter-spacing:0.2px;
    color:var(--petrol-900);
    line-height:1.15;
  }

  h1 .accent{
    color:var(--gold);
  }

  .headline{
    font-size:clamp(13px, 3.5vw, 15px);
    letter-spacing:1.7px;
    text-transform:uppercase;
    color:var(--petrol-700);
    font-weight:600;
    margin-top:2px;
  }

  .divider{
    width:39px;
    height:2px;
    background:linear-gradient(90deg, var(--gold), transparent);
    margin: clamp(7px,1.6vh,12px) 0;
    border-radius:2px;
  }

  .bio{
    font-size:clamp(14px, 3.6vw, 15.5px);
    color:var(--muted);
    max-width:368px;
    line-height:1.5;
  }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:clamp(10px, 2.1vh, 15px);
    margin: clamp(9px,2.3vh,18px) 0;
  }

  .btn{
    position:relative;
    isolation:isolate;
    overflow:hidden;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding: clamp(14px, 2.8vh, 17px) 21px;
    border-radius:18px;
    text-decoration:none;
    font-weight:600;
    font-size:clamp(15.5px, 3.9vw, 17px);
    border:1px solid rgba(255,255,255,0.4);
    background:rgba(255,255,255,0.16);
    transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease, background .3s ease, border-color .3s ease;
  }

  .btn .glass-shadow{
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
    border-radius:inherit;
    box-shadow:
      inset 1.5px 1.5px 1px -1px rgba(255,255,255,0.9),
      inset -1.5px -1.5px 1px -1px rgba(11,52,54,0.35),
      inset 0 0 10px 3px rgba(255,255,255,0.18),
      0 4px 18px rgba(11,52,54,0.14);
  }

  .btn .glass-warp{
    position:absolute;
    inset:0;
    z-index:0;
    border-radius:inherit;
    -webkit-backdrop-filter:blur(10px) saturate(170%);
    backdrop-filter:blur(10px) saturate(170%);
  }

  @supports ((-webkit-backdrop-filter: url(#glass-distortion)) or (backdrop-filter: url(#glass-distortion))){
    .btn .glass-warp{
      -webkit-backdrop-filter:url(#glass-distortion) blur(4px) saturate(170%);
      backdrop-filter:url(#glass-distortion) blur(4px) saturate(170%);
    }
  }

  .btn .icon,
  .btn .label,
  .btn .arrow{
    position:relative;
    z-index:2;
  }

  .btn .icon{
    flex:0 0 auto;
    width:23px;
    height:23px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .btn .label{flex:1; text-align:left;}
  .btn .arrow{opacity:.6; font-size:16px; transition:transform .3s ease;}

  .btn:hover{transform:translateY(-2px) scale(1.015);}
  .btn:hover .arrow{transform:translateX(3px);}
  .btn:active{transform:translateY(0) scale(0.98);}

  .btn-primary{
    background:linear-gradient(135deg, rgba(11,52,54,0.62), rgba(21,94,95,0.5));
    color:var(--offwhite);
    border-color:rgba(230,205,154,0.35);
    box-shadow:0 8px 22px rgba(11,52,54,0.24);
  }
  .btn-primary:hover{box-shadow:0 14px 28px rgba(11,52,54,0.32);}
  .btn-primary .icon svg{stroke:var(--gold-light);}

  .btn-secondary{
    background:rgba(255,255,255,0.32);
    color:var(--petrol-900);
    border-color:rgba(255,255,255,0.55);
    box-shadow:0 4px 14px rgba(11,52,54,0.08);
  }
  .btn-secondary:hover{
    border-color:var(--gold);
    box-shadow:0 10px 22px rgba(189,154,95,0.22);
  }
  .btn-secondary .icon svg{stroke:var(--petrol-800);}

  .btn-ghost{
    background:rgba(255,255,255,0.1);
    color:var(--petrol-800);
    border-color:rgba(21,94,95,0.25);
  }
  .btn-ghost:hover{
    background:rgba(255,255,255,0.22);
    border-color:var(--petrol-700);
  }
  .btn-ghost .icon svg{stroke:var(--petrol-700);}

  footer{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }

  .cro{
    font-size:clamp(11.5px, 3vw, 12.5px);
    letter-spacing:1.1px;
    color:var(--muted);
    text-transform:uppercase;
  }

  .cro .dot{
    color:var(--gold);
    margin:0 7px;
  }

  @media (max-height: 620px){
    .bio{display:none;}
    .avatar-wrap{width:74px; height:74px;}
    .top{gap:4px;}
  }

  @media (min-width: 480px){
    .card{max-height:800px;}
  }
</style>
</head>

        <feDisplacementMap in="SourceGraphic" in2="blurredNoise" scale="26" xChannelSelector="R" yChannelSelector="B" result="displaced" />
        <feGaussianBlur in="displaced" stdDeviation="1.2" result="finalBlur" />
        <feComposite in="finalBlur" in2="finalBlur" operator="over" />
      </filter>
    </defs>
  </svg>
